[package]
name = "opensea-fcfs-sniper"
version = "0.1.0"
edition = "2021"
description = "Dual-mode OpenSea WL+Public FCFS sniper — api-snipe + pre-sign public"
license = "MIT"

[dependencies]
alloy = { version = "0.9", features = ["full", "signer-local", "reqwest", "consensus", "network"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
eyre = "0.6"
futures = "0.3"
hex = "0.4"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
